# ivanboot.dev stack. On the VPS it lives at /opt/ivanboot (see infra/deploy.sh).
#   docker compose -p ivanboot -f infra/docker-compose.yml up -d --build
name: ivanboot

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # videos hosted on the VPS itself, served at ivanboot.dev/v/ (outside the repo: deploys never touch it)
      - ../media:/srv/media:ro
      - caddy_data:/data # TLS certificates: keep across rebuilds (Let's Encrypt rate limits)
      - caddy_config:/config
    env_file: ../sites.env # the domains in the Caddyfile
    depends_on:
      - web
      - api

  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_STORE_BASE: ""
        # Dev-store password page sits in front of Shopify checkout; it is shown to visitors
        # in the cart on purpose (it protects nothing but the dev storefront). Empty = hidden.
        NEXT_PUBLIC_STORE_PASSWORD: "ardea"
        # the two portfolio versions' domains and hiring profiles (sites.env, via --env-file in deploy.sh)
        UPWORK_SITE_HOST: ${UPWORK_SITE_HOST}
        UPWORK_STORE_HOST: ${UPWORK_STORE_HOST}
        UPWORK_PROFILE_URL: ${UPWORK_PROFILE_URL}
        WORKANA_SITE_HOST: ${WORKANA_SITE_HOST}
        WORKANA_STORE_HOST: ${WORKANA_STORE_HOST}
        WORKANA_PROFILE_URL: ${WORKANA_PROFILE_URL}
    restart: unless-stopped
    env_file: # Shopify server-side tokens and the sites' domains; read at runtime, never baked into the image
      - ../.env
      - ../sites.env
    expose:
      - "3000"

  api:
    build: ../apps/api
    restart: unless-stopped
    env_file:
      - ../.env
      - ../sites.env # which store (domain) belongs to which portfolio version
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
    expose:
      - "8000"

volumes:
  caddy_data:
  caddy_config:
