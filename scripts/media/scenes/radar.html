<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  #stage { position: absolute; inset: 0; transform-origin: 60% 50%; }
  .win { left: 110px; top: 200px; width: 1000px; height: 690px; }
  .tabs { display: flex; gap: 6px; padding: 12px 20px 0; background: #e3e8ef; }
  .tab { padding: 12px 26px; border-radius: 12px 12px 0 0; font-size: 18px; color: #6b7689; background: #d9dfe8; }
  .tab.on { background: #fff; color: #1b2433; font-weight: 600; }
  .page { padding: 34px 44px; position: relative; }
  .page h3 { font-size: 34px; font-weight: 700; color: #0f1e36; }
  .page p { margin-top: 6px; font-size: 19px; color: #6b7689; }
  table { margin-top: 28px; width: 100%; border-collapse: collapse; font-size: 22px; }
  th { text-align: left; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7689;
    padding: 12px 16px; background: #f3f5f9; }
  td { padding: 17px 16px; border-bottom: 1px solid #eef1f5; }
  td.p { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  th.p { text-align: right; }
  .name { display: inline-block; height: 18px; border-radius: 9px; background: #c3cbd6; filter: blur(3px); vertical-align: middle; }
  .st { color: #1e8e5a; font-size: 18px; }
  tr.target td { background: rgba(36,87,197,0.06); }
  tr.hit td { background: #e3f4ec; }
  .scan { position: absolute; left: 44px; right: 44px; height: 70px; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(94,234,212,0.35), transparent); }
  .panel { position: absolute; left: 1190px; top: 200px; width: 620px; height: 690px; border-radius: 22px;
    background: linear-gradient(180deg, #12171d, #0e1216); border: 1px solid var(--line); padding: 36px 40px; }
  .panel h4 { font-size: 20px; letter-spacing: 0.28em; color: var(--glow); font-weight: 600; }
  .clock { position: relative; width: 280px; height: 280px; margin: 28px auto 0; }
  .clock svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .clock .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .clock .n { font-size: 84px; font-weight: 700; font-variant-numeric: tabular-nums; color: #fff; line-height: 1; }
  .clock .l { margin-top: 10px; font-size: 19px; color: var(--muted); }
  .every { margin-top: 24px; text-align: center; font-size: 22px; color: var(--text); }
  .lapse { position: absolute; top: 34px; right: 40px; font-size: 15px; letter-spacing: 0.14em; color: var(--lamp);
    border: 1px solid rgba(242,180,92,0.5); border-radius: 999px; padding: 5px 12px; }
  .log { margin-top: 22px; font-size: 19px; line-height: 1.9; color: #9aa5b1; }
  .log .hit { color: var(--ok); font-weight: 700; }
  .found { position: absolute; left: 40px; right: 40px; bottom: 34px; text-align: center; padding: 18px; border-radius: 16px;
    background: rgba(76,208,141,0.14); border: 1px solid rgba(76,208,141,0.6); color: var(--ok); font-size: 24px; font-weight: 600; }
</style></head>
<body>
<div id="stage">
  <div class="win">
    <div class="tabs"><div class="tab">Buyer site A</div><div class="tab">Buyer site B</div><div class="tab">Buyer site C</div></div>
    <div class="bar"><span class="url mono" id="url">https://buyer-site-a.example/sell</span></div>
    <div class="page">
      <h3>We buy game currency</h3>
      <p>Price paid per million, updated live</p>
      <table><thead><tr><th>Server</th><th class="p">Price / M</th><th class="p">Status</th></tr></thead><tbody id="rows"></tbody></table>
      <div class="scan" id="scan"></div>
    </div>
  </div>
  <div class="panel" id="panel">
    <h4>PRICE MONITOR</h4><span class="lapse">TIME-LAPSE</span>
    <div class="clock">
      <svg viewBox="0 0 300 300" width="280" height="280"><circle cx="150" cy="150" r="132" fill="none" stroke="#222a33" stroke-width="14"/>
        <circle id="arc" cx="150" cy="150" r="132" fill="none" stroke="#5eead4" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="829.4" stroke-dashoffset="0" style="filter: drop-shadow(0 0 10px rgba(94,234,212,0.6))"/></svg>
      <div class="c"><div class="n" id="num">60</div><div class="l" id="lab">next check (s)</div></div>
    </div>
    <div class="every">Every minute · 24/7 · target <b style="color:#fff">3.50</b> · <b style="color:#fff">40 M</b></div>
    <div class="log mono" id="log"></div>
    <div class="found" id="found">✓ Match found → asking the owner</div>
  </div>
</div>
<script>
const clamp = (x) => Math.max(0, Math.min(1, x)), ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const ROWS = [[150, [4.01, 3.99, 4.03, 4.02]], [120, [2.75, 2.76, 2.74, 2.75]], [170, [3.41, 3.44, 3.47, 3.52]],
              [130, [1.92, 1.93, 1.93, 1.94]], [160, [5.10, 5.08, 5.12, 5.11]], [110, [3.02, 3.01, 3.04, 3.03]]];
const TARGET = 2, CHECKS = [0.45, 1.55, 2.65, 3.75], SITES = ["a", "b", "c", "a"];
const LOG = ["21:02  3 sites checked · no match", "21:03  3 sites checked · no match", "21:04  3 sites checked · no match"];
const rows = document.getElementById("rows");
ROWS.forEach(([w], i) => {
  const tr = document.createElement("tr"); if (i === TARGET) tr.className = "target";
  tr.innerHTML = `<td><span class="name" style="width:${w}px"></span></td><td class="p">—</td><td class="p st">Buying</td>`;
  rows.append(tr);
});
window.DUR = 5.5;
window.render = (t) => {
  document.getElementById("stage").style.transform = `scale(${1 + 0.035 * ease(t / DUR)})`;
  const k = CHECKS.filter((c) => t >= c).length - 1;           // last check done
  const tabs = document.querySelectorAll(".tab");
  const cur = Math.max(0, k);
  // during a check the three sites are read one after another (tab A, B, C), each for a third of the scan
  const inCheck = k >= 0 ? t - CHECKS[k] : -1;
  const site = inCheck >= 0 && inCheck < 0.6 ? Math.min(2, Math.floor(inCheck / 0.2)) : 0;
  tabs.forEach((tb, i) => tb.classList.toggle("on", i === site));
  document.getElementById("url").textContent = `https://buyer-site-${"abc"[site]}.example/sell`;
  [...rows.children].forEach((tr, i) => {
    tr.children[1].textContent = k < 0 ? "—" : ROWS[i][1][cur].toFixed(2);
    tr.classList.toggle("hit", i === TARGET && k === 3 && t >= CHECKS[3] + 0.35);
  });
  const scan = document.getElementById("scan");
  scan.style.opacity = inCheck >= 0 && inCheck < 0.6 ? 1 - ease((inCheck - 0.45) / 0.15) : 0;
  scan.style.top = (190 + 380 * clamp(((inCheck % 0.2) + 0.2) % 0.2 / 0.2)) + "px";
  // countdown: drains between checks (time-lapse); frozen once the match is found
  const next = CHECKS.find((c) => c > t);
  const prev = k >= 0 ? CHECKS[k] : 0;
  let left = next ? 1 - (t - prev) / (next - prev) : 1;
  if (t >= CHECKS[3]) left = 1;
  document.getElementById("arc").setAttribute("stroke-dashoffset", 829.4 * (1 - left));
  document.getElementById("num").textContent = t >= CHECKS[3] ? "✓" : String(Math.round(60 * left)).padStart(2, "0");
  document.getElementById("lab").textContent = t >= CHECKS[3] ? "match found" : "next check (s)";
  document.getElementById("num").style.color = t >= CHECKS[3] ? "#4cd08d" : "#fff";
  document.getElementById("arc").setAttribute("stroke", t >= CHECKS[3] ? "#4cd08d" : "#5eead4");
  const lines = LOG.slice(0, Math.max(0, Math.min(3, k + (t >= CHECKS[Math.max(0, k)] + 0.6 ? 1 : 0)))).map((l) => `<div>${l}</div>`);
  if (t >= CHECKS[3] + 0.35) lines.push(`<div class="hit">21:05  MATCH  3.52 ≥ 3.50 · 40 M</div>`);
  document.getElementById("log").innerHTML = lines.join("");
  const f = document.getElementById("found");
  f.style.opacity = ease((t - CHECKS[3] - 0.6) / 0.35); f.style.transform = `translateY(${16 * (1 - ease((t - CHECKS[3] - 0.6) / 0.4))}px)`;
  document.getElementById("panel").style.borderColor = t >= CHECKS[3] + 0.35 ? "rgba(76,208,141,0.6)" : "#222a33";
};
render(0);
</script>
</body></html>
