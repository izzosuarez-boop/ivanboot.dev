<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<script src="m-common.js"></script>
<!-- Section 4 project loop (6 s, seamless) for "Ardea Skin: a Shopify store with an identity of its own": the real
     store pages (media_assemble.py capture) with the brand film and the tutorial playing in place, then the owner's
     Telegram alert in the real format of notify.stock_alert. -->
<style>
  html, body { width: 1440px; height: 1080px; }
  .win { left: 40px; top: 150px; width: 900px; height: 780px; background: #f5f0e8; }
  .view { position: absolute; left: 0; right: 0; top: 56px; bottom: 0; overflow: hidden; }
  .pg { position: absolute; left: 0; top: 0; width: 900px; }
  .pg > img { display: block; width: 900px; }
  .steps { position: absolute; left: 985px; top: 200px; width: 420px; }
  .eyebrow { font-size: 22px; letter-spacing: 0.3em; color: var(--glow); font-weight: 600; margin-bottom: 30px; }
  .step { display: flex; align-items: center; gap: 20px; padding: 20px 22px; margin-bottom: 16px; border-radius: 22px;
    border: 2px solid var(--line); background: rgba(18,22,27,0.8); font-size: 30px; font-weight: 600; color: #6b7689; line-height: 1.15; }
  .step .n { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; border: 2px solid #2a333d; flex: none; }
  .step.on { border-color: rgba(94,234,212,0.7); background: rgba(94,234,212,0.1); color: #fff; }
  .step.on .n { border-color: var(--glow); color: var(--glow); }
  .step.done { color: #c3cad3; }
  .step.done .n { background: var(--glow); border-color: var(--glow); color: #06221f; }
  .tg { position: absolute; left: 985px; top: 690px; width: 420px; border-radius: 22px; background: #17212b; border: 1px solid #2b3a48;
    padding: 18px 20px; box-shadow: 0 30px 80px -30px rgba(0,0,0,0.9); }
  .tg .who { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; color: #fff; }
  .tg .who i { width: 40px; height: 40px; border-radius: 50%; background: #2aabee; display: grid; place-items: center; font-style: normal; font-size: 20px; }
  .tg .who small { display: block; font-size: 15px; font-weight: 400; color: #8b9bab; }
  .tg .msg { margin-top: 14px; padding: 14px 16px; border-radius: 14px 14px 14px 4px; background: #182533; border: 1px solid #2b5278; font-size: 21px; line-height: 1.4; color: #e9eef3; }
</style></head>
<body>
<div class="win"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url mono" id="url">tienda.ivanboot.dev</span></div>
  <div class="view">
    <div class="pg" id="home"><img src="../out/portfolio-media-overview/store/home.png"></div>
    <div class="pg" id="cat"><img src="../out/portfolio-media-overview/store/cleansers.png"></div>
    <div class="pg" id="prod"><img src="../out/portfolio-media-overview/store/product.png"></div>
  </div></div>
<div class="steps">
  <div class="eyebrow">ARDEA SKIN · SHOPIFY</div>
  <div class="step" id="s0"><span class="n">1</span>One brand identity</div>
  <div class="step" id="s1"><span class="n">2</span>On every page and product</div>
  <div class="step" id="s2"><span class="n">3</span>Run from Telegram</div>
</div>
<div class="tg" id="tg"><div class="who"><i>✈</i><span>Ardea Skin bot<small>to the store owner</small></span></div>
  <div class="msg">📉 <b>Low stock:</b> Clarifying Gel Cleanser — only 8 left</div></div>
<script>
window.SIZE = [1440, 1080];
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.max(0, Math.min(1, x)), ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const K = 900 / 1440;                                   // captured CSS px -> window px
const place = (parent, b, src) => { const v = video(src, `left:${b.x * K}px; top:${b.y * K}px; width:${b.w * K}px; height:${b.h * K}px`); parent.append(v); return v; };
let brand, howto;
const PAGES = [["home", 0], ["cat", 1.9], ["prod", 3.6]], BACK = 5.4;
const URLS = ["tienda.ivanboot.dev", "tienda.ivanboot.dev/collections/cleansers", "tienda.ivanboot.dev/products/clarifying-gel-cleanser"];
window.DUR = 6.0;
window.render = async (t) => {
  if (!brand) {                                          // boxes.js sets window.BOXES (file:// pages can't fetch JSON)
    brand = place($("home"), window.BOXES.home.videos[0], VID.brand);
    howto = place($("cat"), window.BOXES.cleansers.videos[0], VID.howto);
  }
  // each page fades in over the last; at the end the home page fades back in on top, at the top, as on the first frame
  const page = t < PAGES[1][1] ? 0 : t < PAGES[2][1] ? 1 : t < BACK ? 2 : 0;
  $("home").style.zIndex = t >= BACK ? 5 : 0;
  $("home").style.opacity = t < 2.3 ? 1 : t >= BACK ? ease((t - BACK) / 0.35) : 0;
  $("cat").style.opacity = ease((t - PAGES[1][1]) / 0.3); $("cat").style.zIndex = 1;
  $("prod").style.opacity = ease((t - PAGES[2][1]) / 0.3); $("prod").style.zIndex = 2;
  let yh = 760 * ease((t - 0.9) / 0.8);                  // home: brand film, then down to the product photos
  if (t >= BACK) yh = 0;
  const yc = 700 * ease((t - 2.5) / 0.8);                // category: cover, then down to the tutorial video
  $("home").style.top = (-yh * K) + "px"; $("cat").style.top = (-yc * K) + "px";
  $("url").textContent = URLS[page];
  const step = t < PAGES[1][1] ? 0 : t < 4.1 ? 1 : t < BACK ? 2 : -1;
  [0, 1, 2].forEach((k) => {
    const s = $("s" + k);
    s.classList.toggle("on", k === step);
    s.classList.toggle("done", step >= 0 && k < step);
    s.querySelector(".n").textContent = step >= 0 && k < step ? "✓" : String(k + 1);
  });
  const g = ease((t - 4.2) / 0.3) * (1 - ease((t - BACK) / 0.35));
  $("tg").style.opacity = g; $("tg").style.transform = `translateY(${24 * (1 - ease((t - 4.2) / 0.35))}px)`;
  brand.style.opacity = "1"; howto.style.opacity = "1";
  await seekAll([[brand, t >= BACK ? 0.9 + (t - BACK) : 1.5 + t], [howto, 2.0 + Math.max(0, t - 2.2)]]);
};
</script>
<script src="../out/portfolio-media-overview/store/boxes.js"></script>
</body></html>
