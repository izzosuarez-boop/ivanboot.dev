<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<script src="k-common.js"></script><script src="m-common.js"></script>
<!-- Shot 1: the four section videos playing together; a prompt alone is crossed out; what a video really needs -->
<style>
  #grid { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .cell { position: absolute; width: 900px; height: 506px; border-radius: 18px; overflow: hidden; border: 1px solid #222a33;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.9); }
  .cell video { inset: 0; width: 100%; height: 100%; }
  .cell span { position: absolute; left: 16px; bottom: 14px; font-size: 20px; font-weight: 600; background: rgba(9,11,14,0.75); padding: 6px 14px; border-radius: 999px; }
  #dim { position: absolute; inset: 0; background: rgba(9,11,14,0.78); }
  .prompt { position: absolute; left: 560px; top: 250px; width: 800px; padding: 26px 30px; border-radius: 18px; background: #12171d; border: 1px solid #2a333d;
    font-size: 30px; color: #c3cad3; }
  .prompt small { display: block; font-size: 17px; letter-spacing: 0.2em; color: #8b95a1; margin-bottom: 10px; }
  .strike { position: absolute; left: 540px; top: 316px; height: 6px; background: #ef4444; border-radius: 3px; }
  .need { position: absolute; top: 560px; width: 520px; text-align: center; font-size: 40px; font-weight: 700; }
  .need small { display: block; margin-top: 10px; font-size: 22px; font-weight: 400; color: #8b95a1; }
  .need b { display: block; font-size: 22px; color: var(--glow); letter-spacing: 0.2em; margin-bottom: 14px; }
</style></head>
<body>
<div id="grid"></div>
<div id="dim"></div>
<div class="prompt" id="prompt"><small>PROMPT</small><span id="ptext"></span></div>
<div class="strike" id="strike"></div>
<div class="need" id="n0" style="left:120px"><b>01</b>What to say<small>the one idea</small></div>
<div class="need" id="n1" style="left:700px"><b>02</b>What to show<small>which part of the product</small></div>
<div class="need" id="n2" style="left:1280px"><b>03</b>How to tell it<small>understood the first time</small></div>
<script>
const CELLS = [["hub", "Home", 20.0, 40, 30], ["ai", "AI Agents", 25.0, 980, 30], ["auto", "Automation", 31.0, 40, 552], ["web", "Web & API", 40.0, 980, 552]];
const grid = document.getElementById("grid");
const vids = CELLS.map(([k, name, , x, y]) => {
  const c = document.createElement("div"); c.className = "cell"; c.style.left = x + "px"; c.style.top = y + "px";
  const v = video(VID[k], "inset:0; width:100%; height:100%"); c.append(v);
  const s = document.createElement("span"); s.textContent = name; c.append(s); grid.append(c); return v;
});
const PROMPT = "make me a video about my business";
window.DUR = 13.2;
window.render = async (t) => {
  grid.style.transform = `scale(${1 + 0.03 * ease(t / DUR)})`;
  document.getElementById("dim").style.opacity = ease((t - 3.4) / 0.5) * 0.95;
  const p = document.getElementById("prompt");
  p.style.opacity = ease((t - 3.5) / 0.3);
  document.getElementById("ptext").textContent = PROMPT.slice(0, Math.round(PROMPT.length * clamp((t - 3.6) / 1.0)));
  const s = document.getElementById("strike"); s.style.width = (840 * ease((t - 5.0) / 0.35)) + "px";
  p.style.filter = t > 5.4 ? "grayscale(1) brightness(0.6)" : "none";
  [6.0, 8.2, 9.7].forEach((at, i) => popIn(document.getElementById("n" + i), t, at, 0.4));
  await seekAll(vids.map((v, i) => [v, CELLS[i][2] + t]));
};
</script>
</body></html>
