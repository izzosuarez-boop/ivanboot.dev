<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  #stage { position: absolute; inset: 0; }
  .term { position: absolute; border-radius: 18px; background: #0d1116; border: 1px solid var(--line);
    box-shadow: 0 40px 100px -30px rgba(0,0,0,0.9); overflow: hidden; transform-origin: 0 100%; }
  .term .tb { height: 46px; background: #141a21; display: flex; align-items: center; gap: 10px; padding: 0 18px;
    font-size: 16px; color: var(--muted); }
  .term .tb i { width: 12px; height: 12px; border-radius: 50%; background: #2a333d; display: inline-block; }
  .term pre { padding: 22px 26px; font-size: 22px; line-height: 1.75; color: #c3cad3; white-space: pre-wrap; }
  .ok { color: var(--ok); } .ar { color: var(--glow); } .dim { color: #6b7689; }
  .win { left: 640px; top: 120px; width: 1200px; height: 840px; }
  .tag { position: absolute; left: 640px; top: 66px; }
  .site { display: flex; align-items: center; gap: 14px; padding: 22px 44px; border-bottom: 1px solid #eef1f5; }
  .logo { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #2457c5, #5b8def); }
  .site b { font-size: 24px; color: #0f1e36; }
  .site span { margin-left: auto; font-size: 18px; color: #6b7689; }
  .pg { position: absolute; left: 0; right: 0; top: 140px; bottom: 0; padding: 30px 60px; }
  .pg h3 { font-size: 34px; color: #0f1e36; }
  .pg p { margin-top: 6px; font-size: 19px; color: #6b7689; }
  .grid { margin-top: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
  .f label { display: block; font-size: 16px; font-weight: 600; color: #6b7689; letter-spacing: 0.04em; margin-bottom: 8px; }
  .f .in { height: 56px; border: 1.5px solid #dce2eb; border-radius: 12px; display: flex; align-items: center; padding: 0 18px;
    font-size: 22px; color: #1b2433; background: #fff; }
  .f .in.act { border-color: #2457c5; box-shadow: 0 0 0 4px rgba(36,87,197,0.15); }
  .f .in.done { background: #f8fafc; }
  .caret { display: inline-block; width: 2px; height: 26px; background: #2457c5; margin-left: 2px; }
  .btn { margin-top: 26px; height: 62px; border-radius: 12px; background: #2457c5; color: #fff; font-size: 23px; font-weight: 700;
    display: grid; place-items: center; }
  .login { width: 520px; margin: 40px auto 0; }
  .login .f { margin-top: 18px; }
  .toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 18px 30px; border-radius: 14px;
    background: #e3f4ec; color: #1e8e5a; font-size: 24px; font-weight: 700; border: 1px solid #b7e2cb; white-space: nowrap; }
</style></head>
<body>
<div id="stage">
  <div class="term" id="term"><div class="tb"><i></i><i></i><i></i><span style="margin-left:12px">sale-bot</span></div><pre class="mono" id="log"></pre></div>
  <div class="tag chip" id="tag">◌ Headless browser · running in the background</div>
  <div class="win" id="win">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url mono" id="url"></span></div>
    <div class="site"><div class="logo"></div><b>Buyer site A</b><span id="who">Log in</span></div>
    <div class="pg" id="login">
      <div class="login"><h3>Welcome back</h3><p>Log in to sell</p>
        <div class="f"><label>EMAIL</label><div class="in" id="l-email"></div></div>
        <div class="f"><label>PASSWORD</label><div class="in" id="l-pass"></div></div>
        <div class="btn" id="l-btn">Log in</div></div>
    </div>
    <div class="pg" id="sell">
      <h3>Create a sell order</h3><p>We pay as soon as the delivery is confirmed</p>
      <div class="grid" id="fields"></div>
      <div class="btn" id="s-btn">Create sell order</div>
    </div>
  </div>
</div>
<script>
const clamp = (x) => Math.max(0, Math.min(1, x)), ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const LOG = [[0.5, '<span class="ok">✓</span> owner approved on Telegram <span class="dim">21:05:42</span>'],
             [1.4, '<span class="ar">→</span> sale: 40 M at 3.52 USDT / M'],
             [2.4, '<span class="ar">→</span> launching headless browser…'],
             [4.4, '<span class="ar">→</span> buyer-site-a: logging in'],
             [7.6, '<span class="ok">✓</span> logged in'],
             [7.9, '<span class="ar">→</span> filling the sell order'],
             [10.45, '<span class="ok">✓</span> order #48213 created']];
// [label, value, start, wide, blurred]
const FIELDS = [["SERVER", "████████", 7.9, false, true], ["AMOUNT", "40 M", 8.15, false],
                ["PRICE PER MILLION", "3.52 USDT", 8.35, false], ["TOTAL", "140.80 USDT", 8.5, false],
                ["FULL NAME", "Alex Morgan", 8.65, false], ["EMAIL", "alex.morgan@example.com", 8.95, false],
                ["LOCATION", "Lisbon, Portugal", 9.3, false], ["PAYOUT", "USDT (TRC-20) · TDemo…9xQ", 9.55, false]];
const fields = document.getElementById("fields");
FIELDS.forEach(([l]) => { const d = document.createElement("div"); d.className = "f"; d.innerHTML = `<label>${l}</label><div class="in"></div>`; fields.append(d); });
const typed = (el, text, t0, cps, t, blur) => {
  const n = Math.floor(clamp((t - t0) * cps / text.length) * text.length);
  const on = t >= t0 && n < text.length;
  el.classList.toggle("act", on); el.classList.toggle("done", n >= text.length);
  el.innerHTML = (blur && n ? `<span class="blur">${text.slice(0, n)}</span>` : text.slice(0, n)) + (on ? '<span class="caret"></span>' : "");
};
window.DUR = 11.2;
window.render = (t) => {
  // terminal: big in the middle, then docked bottom-left when the browser opens
  const dock = ease((t - 3.5) / 0.7), term = document.getElementById("term");
  const big = { x: 460, y: 330, w: 1000, h: 420 }, small = { x: 60, y: 640, w: 540, h: 330 };
  const L = (a, b) => a + (b - a) * dock;
  Object.assign(term.style, { left: L(big.x, small.x) + "px", top: L(big.y, small.y) + "px", width: L(big.w, small.w) + "px", height: L(big.h, small.h) + "px" });
  term.querySelector("pre").style.fontSize = L(26, 17) + "px";
  term.style.opacity = ease(t / 0.3);
  document.getElementById("log").innerHTML = LOG.filter(([at]) => t >= at).map(([, s]) => s).join("\n");
  const w = document.getElementById("win"), wa = ease((t - 3.6) / 0.6);
  w.style.opacity = wa; w.style.transform = `translateX(${80 * (1 - wa)}px) scale(${0.96 + 0.04 * wa})`;
  const tg = document.getElementById("tag"); tg.style.opacity = ease((t - 4.0) / 0.4);
  const loginOn = t < 7.6;
  document.getElementById("login").style.display = loginOn ? "block" : "none";
  document.getElementById("sell").style.display = loginOn ? "none" : "block";
  document.getElementById("url").textContent = loginOn ? "https://buyer-site-a.example/login" : "https://buyer-site-a.example/sell";
  document.getElementById("who").textContent = loginOn ? "Log in" : "Signed in · Alex M.";
  typed(document.getElementById("l-email"), "alex.morgan@example.com", 4.6, 22, t);
  typed(document.getElementById("l-pass"), "••••••••••••", 5.9, 16, t);
  const lb = document.getElementById("l-btn"); lb.style.filter = t > 7.1 && t < 7.35 ? "brightness(0.8)" : "none";
  [...fields.children].forEach((d, i) => typed(d.querySelector(".in"), FIELDS[i][1], FIELDS[i][2], 60, t, FIELDS[i][4]));
  const sb = document.getElementById("s-btn"); sb.style.filter = t > 10.15 && t < 10.4 ? "brightness(0.8)" : "none";
  // the button turns into the confirmation
  const okd = t >= 10.4;
  sb.textContent = okd ? "✓ Sell order #48213 created" : "Create sell order";
  sb.style.background = okd ? "#1e8e5a" : "#2457c5";
};
render(0);
</script>
</body></html>
