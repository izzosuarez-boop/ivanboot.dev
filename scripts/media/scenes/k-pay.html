<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<script src="../out/logos-kamas/logos.js"></script><script src="k-common.js"></script>
<!-- Shot 4: payment integrations: BNB Chain + USDT, Wompi (COP payouts), Binance + NOWPayments (payouts abroad) -->
<style>
  #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .eyebrow { position: absolute; top: 120px; width: 100%; text-align: center; font-size: 24px; letter-spacing: 0.34em; color: var(--glow); font-weight: 600; }
  .col { position: absolute; top: 230px; width: 520px; height: 640px; border-radius: 28px; border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(18,22,27,0.9), rgba(14,18,22,0.9)); }
  .col h4 { position: absolute; bottom: 40px; width: 100%; text-align: center; font-size: 28px; font-weight: 700; padding: 0 30px; line-height: 1.3; }
  .col h4 small { display: block; margin-top: 6px; font-size: 20px; font-weight: 400; color: var(--muted); }
  .pill { position: absolute; padding: 10px 22px; border-radius: 999px; font-size: 22px; font-weight: 700; background: #fff; color: #1b2433; white-space: nowrap; }
</style></head>
<body>
<div id="cam">
  <div class="eyebrow">PAYMENTS</div>
  <div class="col" id="c0" style="left:110px"><h4>Contracts on BNB Chain<small>buyers pay in USDT (BEP-20)</small></h4></div>
  <div class="col" id="c1" style="left:700px"><h4>Payouts in pesos<small>to sellers in Colombia</small></h4></div>
  <div class="col" id="c2" style="left:1290px"><h4>Payouts abroad<small>to sellers outside Colombia</small></h4></div>
  <div id="tiles"></div>
</div>
<script>
const T = document.getElementById("tiles");
// [slug, x, y, size, appears]
const TILES = [["bnbchain", 210, 330, 150, 1.3], ["tether", 420, 330, 150, 2.4], ["wompi", 885, 300, 150, 3.8],
               ["binance", 1395, 330, 150, 9.9], ["nowpayments", 1605, 330, 150, 10.9]];
const els = TILES.map(([s, x, y, size]) => { const el = tile(s, size); el.style.left = (x - size / 2) + "px"; el.style.top = y + "px"; T.append(el); return el; });
const PILLS = [["Nequi", 775, 560, 6.7], ["Bancolombia", 905, 560, 7.4], ["Bre-B", 1095, 560, 8.4]];
const pills = PILLS.map(([w, x, y]) => { const p = document.createElement("div"); p.className = "pill"; p.textContent = w; p.style.left = x + "px"; p.style.top = y + "px"; T.append(p); return p; });
window.DUR = 14.2;
window.render = (t) => {
  document.getElementById("cam").style.transform = `scale(${1 + 0.03 * ease(t / DUR)})`;
  document.querySelector(".eyebrow").style.opacity = ease((t - 0.2) / 0.4);
  [1.2, 3.7, 9.8].forEach((at, i) => {
    const c = document.getElementById("c" + i);
    c.style.opacity = 0.25 + 0.75 * ease((t - at) / 0.4);
    c.style.borderColor = t >= at ? "rgba(94,234,212,0.45)" : "#222a33";
  });
  els.forEach((el, i) => popIn(el, t, TILES[i][4], 0.4));
  pills.forEach((p, i) => popIn(p, t, PILLS[i][3], 0.35));
};
render(0);
</script>
</body></html>
