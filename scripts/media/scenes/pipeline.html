<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  #stage { position: absolute; inset: 0; transform-origin: 50% 45%; }
  .eyebrow { position: absolute; top: 250px; width: 100%; text-align: center; font-size: 22px; letter-spacing: 0.32em;
    color: var(--glow); font-weight: 600; }
  .node { position: absolute; width: 230px; margin-left: -115px; text-align: center; }
  .ring { width: 132px; height: 132px; margin: 0 auto; border-radius: 50%; border: 2px solid var(--line);
    background: radial-gradient(circle at 50% 35%, #161b21, #0e1216); display: grid; place-items: center;
    color: #9aa5b1; position: relative; }
  .ring svg { width: 58px; height: 58px; }
  .ring .halo { position: absolute; inset: -18px; border-radius: 50%; background: radial-gradient(circle, rgba(94,234,212,0.35), transparent 65%); opacity: 0; }
  .label { margin-top: 22px; font-size: 30px; font-weight: 600; color: var(--text); }
  .sub { margin-top: 6px; font-size: 20px; color: var(--muted); }
  svg.links { position: absolute; inset: 0; }
  .case { position: absolute; top: 760px; width: 100%; text-align: center; }
  .case h2 { margin-top: 22px; font-family: "Fraunces"; font-weight: 500; font-size: 50px; color: #fff; }
</style></head>
<body>
<div id="stage">
  <div class="eyebrow" id="eyebrow">AUTOMATED WORKFLOW</div>
  <svg class="links" viewBox="0 0 1920 1080"><g id="links"></g><circle id="pulse" r="11" fill="#5eead4"/></svg>
  <div id="nodes"></div>
  <div class="case" id="case"><span class="chip">● Real client case</span><h2>Selling an online game's currency, end to end</h2></div>
</div>
<script>
const ICON = {
  scrape: '<circle cx="26" cy="26" r="15"/><path d="M37 37l13 13M18 30l6-7 5 4 7-9"/>',
  decide: '<path d="M32 8v48M14 20h36M14 20l-8 18h16zM50 20l-8 18h16zM22 56h20"/>',
  ask: '<path d="M8 30L56 10 46 54 30 40 8 30zM30 40l-2 14 8-10M56 10L30 40"/>',
  sell: '<rect x="6" y="10" width="52" height="40" rx="5"/><path d="M6 20h52M14 15h2M20 15h2M18 34h20M18 42h12M44 30l6 6-6 6"/>',
  deliver: '<path d="M8 22l24-12 24 12v22L32 56 8 44zM8 22l24 12 24-12M32 34v22"/>',
  report: '<rect x="12" y="6" width="40" height="52" rx="5"/><path d="M20 20h24M20 30h24M20 40h12M38 44l5 5 9-11"/>',
};
const NODES = [["scrape", "Scrape", "3 buyer sites"], ["decide", "Decide", "your own rules"], ["ask", "Ask", "on Telegram"],
               ["sell", "Sell", "browser bot"], ["deliver", "Deliver", "delivery bot"], ["report", "Report", "summary"]];
const Y = 470, X0 = 300, DX = 264;
const nodes = document.getElementById("nodes"), links = document.getElementById("links");
NODES.forEach(([k, l, s], i) => {
  const d = document.createElement("div");
  d.className = "node"; d.style.left = (X0 + i * DX) + "px"; d.style.top = (Y - 66) + "px";
  d.innerHTML = `<div class="ring"><div class="halo"></div><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg></div><div class="label">${l}</div><div class="sub">${s}</div>`;
  nodes.append(d);
  if (i) {
    const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
    ln.setAttribute("x1", X0 + (i - 1) * DX + 72); ln.setAttribute("x2", X0 + i * DX - 72);
    ln.setAttribute("y1", Y); ln.setAttribute("y2", Y); ln.setAttribute("stroke-width", 3); ln.setAttribute("stroke-linecap", "round");
    links.append(ln);
  }
});
const clamp = (x) => Math.max(0, Math.min(1, x)), ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const back = (x) => { x = clamp(x); const c = 1.7; return x <= 0 ? 0 : 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const mix = (a, b, u) => a.map((v, i) => Math.round(v + (b[i] - v) * u));
const DUR = 9.0, P0 = 2.9, P1 = 5.3;              // the pulse runs from node 1 to node 6 between P0 and P1
window.DUR = DUR;
window.render = (t) => {
  document.getElementById("stage").style.transform = `scale(${1 + 0.05 * ease(t / DUR)}) translateY(${-40 * ease((t - 5.4) / 1.0)}px)`;
  document.getElementById("eyebrow").style.opacity = ease((t - 0.1) / 0.5);
  const pu = ease((t - P0) / (P1 - P0)), px = X0 + pu * 5 * DX;
  [...nodes.children].forEach((d, i) => {
    const a = back((t - 0.3 - i * 0.36) / 0.45);
    d.style.opacity = clamp((t - 0.3 - i * 0.36) / 0.25);
    d.style.transform = `scale(${0.6 + 0.4 * a})`;
    const lit = t >= P0 ? ease((px - (X0 + i * DX) + 30) / 60) : 0;
    const ring = d.querySelector(".ring");
    ring.style.borderColor = `rgb(${mix([34, 42, 51], [94, 234, 212], lit)})`;
    ring.style.color = `rgb(${mix([154, 165, 177], [94, 234, 212], lit)})`;
    d.querySelector(".halo").style.opacity = lit * (0.55 + 0.45 * Math.max(0, 1 - Math.abs(px - (X0 + i * DX)) / 120));
  });
  [...links.children].forEach((ln, i) => {
    const g = ease((t - 0.55 - (i + 1) * 0.36 + 0.2) / 0.35);
    const x1 = +ln.getAttribute("x1"), x2full = X0 + (i + 1) * DX - 72;
    ln.setAttribute("x2", x1 + (x2full - x1) * g);
    const lit = clamp((px - x1) / (x2full - x1));
    ln.setAttribute("stroke", lit >= 1 ? "#5eead4" : `url(#none)`);
    ln.style.stroke = lit > 0 ? `rgba(94,234,212,${0.35 + 0.65 * lit})` : "#2a333d";
  });
  const pulse = document.getElementById("pulse");
  pulse.setAttribute("cx", px); pulse.setAttribute("cy", Y);
  pulse.style.opacity = t < P0 ? 0 : t < P1 ? 1 : 1 - ease((t - P1) / 0.4);
  pulse.style.filter = "drop-shadow(0 0 14px #5eead4) drop-shadow(0 0 30px rgba(94,234,212,0.7))";
  const c = document.getElementById("case");
  c.style.opacity = ease((t - 5.6) / 0.6); c.style.transform = `translateY(${30 * (1 - ease((t - 5.6) / 0.7))}px)`;
};
render(0);
</script>
</body></html>
