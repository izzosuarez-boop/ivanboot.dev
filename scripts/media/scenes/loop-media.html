<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Section 4 project loop (6 s, seamless) for "AI & Social Media": the idea, consistent frames, a real
     correction (the beard, with the real photo), and the frame ready to post. All from the section 4 video's stills. -->
<style>
  html, body { width: 1440px; height: 1080px; }
  .stage { position: absolute; left: 50px; top: 150px; width: 880px; height: 780px; border-radius: 28px; overflow: hidden;
    border: 2px solid var(--line); background: linear-gradient(180deg, #12171d, #0c1014); box-shadow: 0 50px 120px -40px rgba(0,0,0,0.95); }
  .layer { position: absolute; inset: 0; }
  .eb { position: absolute; left: 0; right: 0; top: 54px; text-align: center; font-size: 22px; letter-spacing: 0.3em; color: var(--glow); font-weight: 700; }
  .idea { position: absolute; left: 0; right: 0; top: 140px; text-align: center; font-family: Fraunces; font-size: 64px; line-height: 1.15; color: #fff; }
  .idea span { color: var(--glow); }
  .thumb { position: absolute; top: 440px; width: 250px; height: 141px; border-radius: 12px; overflow: hidden; border: 2px solid #2a333d; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .arrow { position: absolute; top: 490px; font: 800 34px Inter; color: var(--glow); }
  .same { position: absolute; left: 0; right: 0; top: 640px; text-align: center; }
  .pic { position: absolute; left: 40px; top: 130px; width: 800px; height: 447px; border-radius: 16px; overflow: hidden; border: 2px solid #2a333d; }
  .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tag { position: absolute; left: 16px; top: 14px; z-index: 3; font-size: 20px; font-weight: 800; letter-spacing: 0.16em; padding: 6px 16px; border-radius: 999px; }
  .ref { position: absolute; right: 16px; bottom: 16px; z-index: 3; width: 140px; height: 140px; border-radius: 12px; overflow: hidden; border: 3px solid #fff; }
  .ref img { width: 100%; height: 100%; object-fit: cover; }
  .ref span { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); font-size: 14px; text-align: center; padding: 3px; }
  .wipe { position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: #fff; box-shadow: 0 0 18px #fff; z-index: 2; }
  .why { position: absolute; left: 0; right: 0; top: 610px; text-align: center; font-size: 30px; font-weight: 700; }
  .post { position: absolute; left: 230px; top: 110px; width: 420px; border-radius: 22px; overflow: hidden; background: #fff; color: #1b2433;
    box-shadow: 0 40px 90px -30px rgba(0,0,0,0.9); }
  .post .hd { display: flex; align-items: center; gap: 10px; padding: 14px 16px; font-size: 19px; font-weight: 700; }
  .post .hd i { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #5eead4, #1f6f66); }
  .post img { display: block; width: 420px; height: 420px; object-fit: cover; }
  .post .ft { padding: 14px 16px 18px; font-size: 18px; line-height: 1.4; }
  .post .ft b { font-variant-numeric: tabular-nums; }
  .pub { position: absolute; left: 0; right: 0; top: 690px; text-align: center; }
  .steps { position: absolute; left: 975px; top: 270px; width: 430px; }
  .eyebrow { font-size: 22px; letter-spacing: 0.3em; color: var(--glow); font-weight: 600; margin-bottom: 30px; }
  .step { display: flex; align-items: center; gap: 20px; padding: 20px 22px; margin-bottom: 16px; border-radius: 22px;
    border: 2px solid var(--line); background: rgba(18,22,27,0.8); font-size: 31px; font-weight: 600; color: #6b7689; }
  .step .n { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; border: 2px solid #2a333d; flex: none; }
  .step.on { border-color: rgba(94,234,212,0.7); background: rgba(94,234,212,0.1); color: #fff; }
  .step.on .n { border-color: var(--glow); color: var(--glow); }
  .step.done { color: #c3cad3; }
  .step.done .n { background: var(--glow); border-color: var(--glow); color: #06221f; }
</style></head>
<body>
<div class="stage">
  <div class="layer" id="L0">
    <div class="eb">THE IDEA</div>
    <div class="idea">Manual work<br><span>→ automatic work</span></div>
    <div class="thumb" id="t0" style="left:55px"><img src="../out/portfolio-media-overview/frames/t-manual.jpg"></div>
    <div class="arrow" id="a0" style="left:318px">→</div>
    <div class="thumb" id="t1" style="left:315px"><img src="../out/portfolio-media-overview/frames/t-ask.jpg"></div>
    <div class="arrow" id="a1" style="left:578px">→</div>
    <div class="thumb" id="t2" style="left:575px"><img src="../out/portfolio-media-overview/frames/t-done.jpg"></div>
    <div class="same" id="same"><span class="chip">Same person · same light · same style</span></div>
  </div>
  <div class="layer" id="L1">
    <div class="eb">THEN IT GETS CORRECTED</div>
    <div class="pic" id="pic">
      <img src="../out/portfolio-ai-agents-overview/coding-still-172658.png">
      <img id="after" src="../out/portfolio-ai-agents-overview/coding-v2-still.png">
      <div class="wipe" id="wipe"></div>
      <span class="tag" id="tag"></span>
      <div class="ref"><img src="../../../apps/web/public/portfolio/ivan.webp"><span>real photo</span></div>
    </div>
    <div class="why" id="why"></div>
  </div>
  <div class="layer" id="L2">
    <div class="post" id="post"><div class="hd"><i></i>ivanboot.dev</div>
      <img src="../out/portfolio-ai-agents-overview/coding-v2-still.png">
      <div class="ft"><b id="likes">♥ 0</b> · An AI agent that works for you, 24/7.</div></div>
    <div class="pub" id="pub"><span class="chip">✓ Ready to post</span></div>
  </div>
</div>
<div class="steps">
  <div class="eyebrow">AI CONTENT</div>
  <div class="step" id="s0"><span class="n">1</span>The idea</div>
  <div class="step" id="s1"><span class="n">2</span>Consistent frames</div>
  <div class="step" id="s2"><span class="n">3</span>Real corrections</div>
  <div class="step" id="s3"><span class="n">4</span>Ready to post</div>
</div>
<script>
window.SIZE = [1440, 1080];
const clamp = (x) => Math.max(0, Math.min(1, x)), ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const $ = (id) => document.getElementById(id);
// a layer on screen from a to b (fades of f seconds)
const span = (t, a, b, f = 0.3) => Math.min(ease((t - a) / f), 1 - ease((t - b) / f));
const P = [0, 1.3, 2.6, 4.1, 5.55];              // phase starts: idea, consistency, correction, post, back to the start
window.DUR = 6.0;
window.render = (t) => {
  // layer 0 is on at t = 0 (and comes back at the end), so the loop has no seam
  $("L0").style.opacity = t < 2.6 ? 1 - ease((t - 2.35) / 0.3) : ease((t - P[4]) / 0.35);
  const back = t >= P[4];                           // on the way back only the idea itself returns
  ["t0", "t1", "t2"].forEach((id, i) => {
    const u = ease((t - 0.35 - i * 0.18) / 0.3);
    $(id).style.opacity = back ? 0 : u; $(id).style.transform = `translateY(${24 * (1 - u)}px)`;
    // consistency: the frames are lined up and outlined as one set
    $(id).style.borderColor = t >= 1.4 && !back ? "rgba(94,234,212,0.85)" : "#2a333d";
  });
  ["a0", "a1"].forEach((id) => { $(id).style.opacity = back ? 0 : ease((t - 1.45) / 0.25); });
  $("same").style.opacity = back ? 0 : ease((t - 1.6) / 0.3);
  // correction: the first version, then a wipe to the edited one
  $("L1").style.opacity = span(t, 2.45, 4.0);
  const w = ease((t - 3.05) / 0.6);
  $("after").style.clipPath = `inset(0 0 0 ${100 * (1 - w)}%)`;
  $("wipe").style.left = (800 * (1 - w)) + "px"; $("wipe").style.opacity = w > 0 && w < 1 ? 1 : 0;
  const fixed = t >= 3.4;
  $("tag").textContent = fixed ? "AFTER" : "BEFORE";
  $("tag").style.background = fixed ? "#4cd08d" : "#ef4444"; $("tag").style.color = fixed ? "#06221f" : "#fff";
  $("why").textContent = fixed ? "✓ Edited to match the real photo" : "✕ The beard didn't match";
  $("why").style.color = fixed ? "#4cd08d" : "#f87171";
  // ready to post
  $("L2").style.opacity = span(t, 3.95, 5.2);
  const p = ease((t - 4.0) / 0.4);
  $("post").style.transform = `translateY(${30 * (1 - p)}px) scale(${0.94 + 0.06 * p})`;
  $("likes").textContent = "♥ " + Math.round(1248 * ease((t - 4.4) / 0.9)).toLocaleString("en-US");
  $("pub").style.opacity = ease((t - 4.7) / 0.25);
  const step = t < P[1] ? 0 : t < P[2] ? 1 : t < P[3] ? 2 : t < P[4] ? 3 : -1;
  [0, 1, 2, 3].forEach((k) => {
    const s = $("s" + k);
    s.classList.toggle("on", k === step);
    s.classList.toggle("done", step >= 0 && k < step);
    s.querySelector(".n").textContent = step >= 0 && k < step ? "✓" : String(k + 1);
  });
};
render(0);
</script>
</body></html>
